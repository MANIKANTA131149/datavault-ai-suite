service: datavault-ai-backend
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1 # Adjust this to your preferred AWS region
  stage: prod
  memorySize: 1024 # Custom resource limits (sufficient for database drivers)
  timeout: 30 # AWS Lambda timeout (seconds)
  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    JWT_SECRET: ${env:JWT_SECRET}
    FRONTEND_URL: ${env:FRONTEND_URL}
    # Optional: extra allowed CORS origins, comma-separated (e.g. an
    # *.amplifyapp.com URL). querify.in + FRONTEND_URL are always allowed.
    CORS_EXTRA_ORIGINS: ${env:CORS_EXTRA_ORIGINS, ""}
    # MUST exactly match the frontend's VITE_API_ENCRYPTION_KEY used at build time.
    # If it doesn't, the backend can't decrypt request bodies → "Invalid encrypted payload".
    # If left empty, both sides fall back to the same default key (works, but the key is public).
    API_ENCRYPTION_KEY: ${env:API_ENCRYPTION_KEY, ""}
    # Analytics dashboard (audit-team login). If unset, the analytics login
    # endpoint returns 503 "credentials not configured" — the rest of the app
    # is unaffected. ANALYTICS_TOKEN_SECRET is optional; it falls back to JWT_SECRET.
    ANALYTICS_USERNAME: ${env:ANALYTICS_USERNAME, ""}
    ANALYTICS_PASSWORD: ${env:ANALYTICS_PASSWORD, ""}
    ANALYTICS_TOKEN_SECRET: ${env:ANALYTICS_TOKEN_SECRET, ""}
    # Optional (only needed if Auth0 is enabled/configured)
    AUTH0_DOMAIN: ${env:AUTH0_DOMAIN, ""}
    AUTH0_CLIENT_SECRET: ${env:AUTH0_CLIENT_SECRET, ""}

package:
  patterns:
    # CRITICAL: never package the "file:.." self-reference. It symlinks back to the
    # repo root, so serverless recurses the entire monorepo (root node_modules,
    # frontend, serverless itself) and runs the packager out of memory.
    - '!node_modules/vite_react_shadcn_ts/**'
    # Exclude dev/build artifacts that don't belong in Lambda
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/__tests__/**'
    - '!node_modules/**/spec/**'
    - '!node_modules/**/README*'
    - '!node_modules/**/*.md'
    - '!node_modules/**/CHANGELOG*'
    - '!node_modules/**/LICENSE*'
    - '!node_modules/**/*.ts'
    - '!node_modules/**/*.map'
    - '!node_modules/**/*.d.ts'
    - '!node_modules/**/docs/**'
    - '!node_modules/**/doc/**'
    - '!node_modules/**/example/**'
    - '!node_modules/**/examples/**'
    - '!node_modules/**/benchmark/**'
    - '!node_modules/**/benchmarks/**'
    - '!node_modules/**/.bin/**'
    # Exclude frontend build tools — never needed at runtime
    - '!node_modules/vite/**'
    - '!node_modules/@vitejs/**'
    - '!node_modules/rollup/**'
    - '!node_modules/@rollup/**'
    - '!node_modules/esbuild/**'
    - '!node_modules/@esbuild/**'
    - '!node_modules/typescript/**'
    - '!node_modules/eslint/**'
    - '!node_modules/@eslint/**'
    - '!node_modules/vitest/**'
    - '!node_modules/@vitest/**'
    - '!node_modules/tailwindcss/**'
    - '!node_modules/postcss/**'
    - '!node_modules/autoprefixer/**'
    - '!node_modules/prettier/**'
    - '!node_modules/@swc/**'
    - '!node_modules/tsx/**'


functions:
  api:
    handler: lambda.handler
    # NOTE: reservedConcurrency was removed — this AWS account's total
    # concurrency quota is too low to carve out a reservation (deploy fails
    # with "decreases UnreservedConcurrentExecution below minimum"). The
    # account-wide cap itself bounds the bill; the API Gateway throttle below
    # is the flood protection. Re-add (e.g. 50) after requesting a quota
    # increase to the default 1000.
    events:
      - httpApi:
          path: /api/{proxy+}
          method: any
      - httpApi:
          path: /api
          method: any

resources:
  extensions:
    # Edge rate limit: API Gateway rejects excess traffic before it ever
    # reaches (and bills) the Lambda. App-level per-route limits live in
    # server/app.js; this is the outer wall.
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
