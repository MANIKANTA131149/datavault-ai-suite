version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci --ignore-scripts
    build:
      commands:
        - nvm use 20
        - npm run build:local
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
