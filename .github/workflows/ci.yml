name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts mirrors amplify.yml and avoids the duckdb-wasm/postinstall
      # native steps that aren't needed to lint/test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Lint is report-only for now: the codebase carries a large pre-existing
      # backlog of @typescript-eslint/no-explicit-any errors. Surfacing them
      # without blocking lets us burn the backlog down over time while still
      # gating on tests + audit. Flip `|| true` off once the backlog is cleared.
      - name: Lint (report-only)
        run: npm run lint || true

      - name: Test
        run: npm test

      # Fail the build on a known high/critical CVE in a production dependency.
      # xlsx (GHSA-4r6h-8v6p-xvw6, GHSA-5pgg-2g8v-p4x9) is an abandoned package
      # with no upstream fix available. It is used only for client-side Excel parsing
      # in the browser (no server-side exec path) and has no viable drop-in replacement
      # at this time. All other high/critical CVEs must be resolved before merging.
      - name: Audit (high+)
        run: |
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          node -e "
            const r = require('./audit.json');
            const KNOWN_UNFIXABLE = new Set([
              'GHSA-4r6h-8v6p-xvw6',
              'GHSA-5pgg-2g8v-p4x9'
            ]);
            const vulns = r.vulnerabilities || {};
            let blocking = 0;
            Object.values(vulns).forEach(v => {
              if (v.severity !== 'high' && v.severity !== 'critical') return;
              const advisories = (v.via || []).filter(x => x.url).map(x => x.url.split('/').pop());
              const allKnown = advisories.length > 0 && advisories.every(id => KNOWN_UNFIXABLE.has(id));
              if (!allKnown) {
                console.error('BLOCKING vulnerability:', v.name, v.severity, advisories);
                blocking++;
              }
            });
            if (blocking > 0) process.exit(1);
            console.log('Audit passed. xlsx exemptions applied for known-unfixable advisories.');
          "

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build frontend
        run: npm run build
