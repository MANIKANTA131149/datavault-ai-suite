name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main # Change this if your default branch is different (e.g. master)

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      VITE_AWS_ACCESS_KEY_ID: ${{ secrets.VITE_AWS_ACCESS_KEY_ID }}
      VITE_AWS_SECRET_ACCESS_KEY: ${{ secrets.VITE_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      VITE_AWS_REGION: ${{ secrets.VITE_AWS_REGION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.VITE_AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials (access keys)
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.VITE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.VITE_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.VITE_AWS_REGION || 'us-east-1' }}

      - name: Deploy Backend via Serverless Framework
        run: npm run aws-deploy:backend
        env:
          VITE_AWS_REGION: ${{ env.VITE_AWS_REGION || 'us-east-1' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # FRONTEND_URL can be added to secrets and mapped here if CORS is strict
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          # Optional: extra allowed CORS origins, comma-separated
          CORS_EXTRA_ORIGINS: ${{ secrets.CORS_EXTRA_ORIGINS }}
          # Must equal the frontend's VITE_API_ENCRYPTION_KEY (used at build time)
          # or request-body decryption fails with "Invalid encrypted payload".
          API_ENCRYPTION_KEY: ${{ secrets.API_ENCRYPTION_KEY }}
          # Analytics dashboard (audit-team login). ANALYTICS_TOKEN_SECRET is
          # optional — leave it unset to reuse JWT_SECRET for signing.
          ANALYTICS_USERNAME: ${{ secrets.ANALYTICS_USERNAME }}
          ANALYTICS_PASSWORD: ${{ secrets.ANALYTICS_PASSWORD }}
          ANALYTICS_TOKEN_SECRET: ${{ secrets.ANALYTICS_TOKEN_SECRET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
